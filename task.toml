[task]
name = "afterquery/cookie-header-recovery"

[metadata]
author_name = "Thomas Morison"
author_email = "matiasv931026@gmail.com"
difficulty_explanation = """A web-platform or front-end infrastructure engineer does this reconstruction when synthetic-monitoring robots report lost carts and dropped sessions but the egress proxy stripped every request Cookie header for privacy. The solver gets the proxy log of 16 robots over 18 days (18,359 requests to ten hosts on five sites, with Set-Cookie, Date and Clear-Site-Data response headers, Fetch Metadata, Referer and Origin), the tag manager script and its config, and a fleet file listing the Chromium feature switches each of four robot pools was launched with. For every request it must state the exact Cookie header Chromium 153 sent. The traffic is synthetic and runs against lab servers that answer from a fixed script and never look at the cookies they receive (the README says so), but it is realistic in the way that matters: every expected header is what a real Chromium 153.0.8010.12 headless shell sent. Each robot ran as a Playwright browser context under a controlled campaign clock, with the real tag manager script running in the page, and the lab servers recorded the Cookie header they received. No expected value comes from the reference solution, and recording the campaign a second time gave the same headers.

Nothing in the log shows a cookie jar, so the solver has to rebuild one per robot that behaves like Chromium's cookie store and feed it request contexts that can only be inferred. The first thing to infer is the frame tree. Site-for-cookies, the initiator, the redirect chain and the CHIPS partition key decide each request's SameSite context, and they are not the same thing as Sec-Fetch-Site. Widget polls inside a cross-site iframe say same-origin but are cross-site for cookies, and plain-http pages get no Fetch Metadata at all. The help widget in turn embeds the shop's own wishlist frame: its requests are same-origin and same-site with the page around the widget, yet they get no SameSite cookies and use a different cookie partition, because a cross-site frame sits in between. The reviews frame is sandboxed, so its requests come from an opaque origin with no Referer, while a navigation of that same frame is keyed by the document it is about to load. Recommendation and pixel requests bounce through the analytics host and back, which matters only in the pools that count the redirect chain. The second thing is the tag manager's state: its writes are not logged, so its per-origin localStorage (visitor id, session rotation, experiment exposure) has to be replayed from the script. The third is store history. Overwrites keep the old creation time only when the value is unchanged, which decides header order and the Lax-allowing-unsafe window on cross-site POSTs. Last-access times move only when a cookie was not touched in the previous 60 seconds. Past 180 cookies per registrable domain Chromium purges to 150 in priority and Secure-protected rounds by last access, so which cookies disappear depends on the whole access history. Wishlist items are kept in partitioned cookies that outgrow the ten-kilobyte budget of one partition, which is trimmed by its own rule. Signing out everywhere sends Clear-Site-Data, which removes the site's cookies together with the ones that same response has just set, but leaves the site's cookies in other partitions. One API host's clock runs twenty minutes fast, and Chromium corrects an Expires date by the response's Date header, so those cookies do not expire when the header text says. The servers also write a few cookies untidily: name prefixes with the wrong attributes, a nameless cookie, a two-digit Expires year. Three pools add switches that few people have worked with: scheme-bound and port-bound cookies (scheme and port join the cookie key, host cookies hide same-named domain cookies, eviction takes domain cookies before host cookies), a three-hour cap on cookies set over http, redirect-chain SameSite, and two variants of the Lax-allowing-unsafe rule.

Measured cost of each wrong reading with everything else right (requests wrong out of 18,359): no domain eviction 1,871; plain LRU eviction 1,827; access time updated on every request 1,562; creation time always inherited on overwrite 10,960; creation time never inherited 10,580; no Lax-allowing-unsafe 397; SameSite context taken from Sec-Fetch-Site 8,048; Partitioned cookies treated as unpartitioned 12,285; schemeless same-site 1,225; no Leave-Secure-Cookies-Alone 971; script allowed to overwrite HttpOnly 1,065; header ordered by creation only 4,047; default cookie path taken as / 2,906; Expires read as an absolute time 162; all pool switches ignored 6,495; scheme binding ignored 2,218; port binding ignored 911; insecure-cookie time limit ignored 598; short Lax-unsafe threshold ignored 234; rigorous Lax check ignored 113; redirect chain ignored 4,750; stock purge order under origin-bound cookies 1,428; no domain shadowing 156; reviews frame treated as an ordinary frame 3,197; frame ancestors ignored 5,055; partition key without the ancestor bit 7,790; frame navigation keyed like a subresource 11,197; sandboxed frame navigation taken as browser-initiated 114; redirected subresources cross-site in every pool 4,806; Clear-Site-Data ignored 4,238; Clear-Site-Data applied before the response cookies 739; Clear-Site-Data clears every partition 134; Clear-Site-Data leaves partitioned cookies 292; no per-partition limit 797; name prefixes ignored 5,973; two-digit Expires year rejected 63; nameless cookie dropped 1,841. Because the store carries state across 18 days, an early mistake keeps producing wrong headers until the cookie involved is overwritten, evicted or cleared. An expert who knows Chromium's cookie code needs roughly two working days to build such a model and check it against the browser."""
solution_explanation = """solution/solve.py reads the proxy log and the fleet file and processes every robot in arrival order with one CookieStore per robot (solution/cookiestore.py), a Python model of Chromium 153's CookieMonster parameterised by the pool's feature switches. The model covers cookie-line parsing (nameless cookies, the __Secure- and __Host- prefixes, Domain, default-path, Max-Age, Expires in Chromium's free-form date syntax and corrected by the response's Date, Secure, HttpOnly, SameSite, Priority, Partitioned, the three-hour cap for insecure cookies), set-time checks (secure source, SameSite set context, Leave-Secure-Cookies-Alone, HttpOnly against script writes), overwrite with creation-time inheritance only for an identical value, the unique key with scheme and port under origin-bound cookies, domain garbage collection (180 -> 150 in six priority/secure purge rounds ordered by last access then creation, domain cookies before host cookies when origin-bound, 60 s access-update granularity), the per-partition limits (180 cookies or 10,240 bytes of names and values, least recently used first), Clear-Site-Data, request inclusion (domain, path, Secure, scheme and port binding, domain shadowing, Strict/Lax/None and the Lax-allowing-unsafe age limit of 120 s, 10 s or none, partition key) and header order (longer path first, then older creation). solution/browsing.py rebuilds the frame tree of each tab from the log and derives each request's context from it. Navigations are recognised by Sec-Fetch-Mode, or by Upgrade-Insecure-Requests on plain http. Redirect hops keep the original initiator and carry their chain. A request is attributed to the document its Referer or Origin names (the full URL when same-origin, the origin otherwise); a request with an opaque origin and no Referer comes from the sandboxed reviews frame. Site-for-cookies is the top-level site while the requesting document and all its ancestors are same-site with the top-level page and not sandboxed, otherwise null. The partition key is the top-level site plus a cross-site-ancestor bit, taken from the requesting document for subresources and from the parent chain and the target URL for frame navigations. Clear-Site-Data with the cookies directive is applied after the response's own Set-Cookie lines and removes the registrable domain's unpartitioned cookies and those of the response's partition. solution/tagmanager.py is a Python port of tm.js with per-origin localStorage; for each audit beacon it replays the script 150 ms earlier, checks the visitor and session ids against the beacon body, and applies the resulting document.cookie writes. The code also carries the 400-day expiry cap, which this log does not exercise. The script reproduces all 18,359 recorded headers."""
verification_explanation = """tests/test_verify.py loads /app/output/cookie_headers.json as JSON data only; no agent code is run. The first test requires a JSON object with exactly one key per request id in the log and string-or-null values. Two more tests compare every value with tests/expected.json, the Cookie header Chromium actually sent, captured server-side during recording: one for requests to alderbay.com hosts and one for the other sites. Headers are compared as ordered lists of name=value entries split at ';' with surrounding whitespace removed, and null, '' and a missing header are equivalent. test.sh writes reward 0 first and writes 1 only when every test passes. The expected data never appears in the agent image."""
category = "Software"
subcategory = "Frontend"
tags = ["cookies", "chromium", "samesite", "chips", "origin-bound-cookies", "web-platform"]
expert_time_estimate_hours = 16
relevant_experience = """Work done for this task: built a recording rig that drives Chromium 153 headless shell through Playwright against multi-host TLS lab servers under a controlled clock, with per-pool feature switches and a real tag manager script running in the page. Read Chromium's net/cookies sources (CookieMonster, CanonicalCookie, CookieBase, cookie_util) at tag 153.0.8010.12 and wrote a Python model of the cookie store covering eviction, access-time granularity, SameSite contexts, CHIPS partitioning and its limits, origin-bound cookies, Clear-Site-Data and Expires/Date correction. Checked that model against every one of the 18,359 recorded requests, recorded the campaign twice to confirm it is reproducible, and measured what each of 37 wrong readings costs."""

